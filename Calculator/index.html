<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple browser calculator built with HTML, CSS, and JavaScript." />
    <title>Basic Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="Calculator">
        <header class="calculator__header">
          <p class="eyebrow">Basic Calculator</p>
          <h1>Calculate with keyboard support </h1>
        </header>

        <div class="calculator__display" role="status" aria-live="polite" aria-atomic="true">
          <div id="expression" class="calculator__expression" aria-label="Current expression">0</div>
          <div id="result" class="calculator__result" aria-label="Current value">0</div>
        </div>

        <div class="calculator__keys" aria-label="Calculator keys">
          <button class="key key--function" data-action="ac" aria-label="All clear">AC</button>
          <button class="key key--function" data-action="clear" aria-label="Clear current entry">C</button>
          <button class="key key--function" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="key key--operator" data-action="operator" data-operator="/" aria-label="Divide">÷</button>

          <button class="key" data-action="digit" data-value="7" aria-label="Seven">7</button>
          <button class="key" data-action="digit" data-value="8" aria-label="Eight">8</button>
          <button class="key" data-action="digit" data-value="9" aria-label="Nine">9</button>
          <button class="key key--operator" data-action="operator" data-operator="*" aria-label="Multiply">×</button>

          <button class="key" data-action="digit" data-value="4" aria-label="Four">4</button>
          <button class="key" data-action="digit" data-value="5" aria-label="Five">5</button>
          <button class="key" data-action="digit" data-value="6" aria-label="Six">6</button>
          <button class="key key--operator" data-action="operator" data-operator="-" aria-label="Subtract">−</button>

          <button class="key" data-action="digit" data-value="1" aria-label="One">1</button>
          <button class="key" data-action="digit" data-value="2" aria-label="Two">2</button>
          <button class="key" data-action="digit" data-value="3" aria-label="Three">3</button>
          <button class="key key--operator" data-action="operator" data-operator="+" aria-label="Add">+</button>

          <button class="key key--wide" data-action="digit" data-value="0" aria-label="Zero">0</button>
          <button class="key" data-action="decimal" data-value="." aria-label="Decimal point">.</button>
          <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
